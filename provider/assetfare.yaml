identity:
  author: odaiin
  name: assetfare
  label:
    en_US: AssetFare
    zh_Hans: AssetFare
  description:
    en_US: >-
      Strictly read-only non-custodial cross-chain capabilities and fee-inclusive quotes across nineteen source
      chains and 100 available routes; 44 have a verified best-from amount and the other 56 preserve route availability without a current price recommendation, so compare them when price matters. Quotes expose a validated ordered direct-route summary: exact protocols,
      endpoints, base-unit amounts, and the one 1bp fee step. All 100 available routes are direct_protocol_only;
      external_intent remains only a compatibility enum with zero current routes. No wallet, authentication, preparation, session, signing, submission,
      funding, swap, or bridge-execution tool.
    zh_Hans: >-
      严格只读的非托管跨链能力与含费报价，覆盖十九个源链和 100 条可用路由；其中 44 条有已验证的最佳起始金额，其余 56 条保持路由可用但当前没有价格推荐，价格重要时应另行比较。报价公开经过验证且按顺序排列的直接路由摘要：精确的协议、端点、基础单位金额、唯一的
      1bp 收费步骤。当前 100 条可用路由全部为 direct_protocol_only；external_intent 仅作为兼容枚举保留，当前路由数为零。不提供钱包、认证、准备、会话、签名、提交、资金、交换或跨链执行工具。
  icon: icon.svg
credentials_for_provider: {}
tools:
  - tools/assetfare_capabilities.yaml
  - tools/assetfare_quote.yaml
extra:
  python:
    source: provider/assetfare.py
