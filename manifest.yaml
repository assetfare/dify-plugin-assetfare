version: 1.0.2
type: plugin
author: odaiin
name: assetfare
label:
  en_US: AssetFare
  zh_Hans: AssetFare
created_at: "2026-09-17T00:00:00Z"
description:
  en_US: AssetFare provides strictly read-only non-custodial capabilities and fee-inclusive quotes across eight source chains and 80 direct_protocol_only routes. Every quote requires dated route-specific economic_guidance, advisory_start_usd, a validated ordered direct-route summary, and the exact 1bp fee step. USD 1 is smoke-only; advisory_start_usd is never an execution minimum or market ranking, and there is no global native-USDC starting amount. Catalog https://assetfare.dev/route-economics.json. The plugin never selects, prepares, signs, submits, or receives wallet secrets.
  zh_Hans: AssetFare 提供严格只读的非托管能力与含费报价，覆盖八个源链和 80 条 direct_protocol_only 路由。每个报价都必须包含按路由划分且带日期的 economic_guidance、advisory_start_usd、经过验证的有序直接路由摘要和精确 1bp 收费步骤。1 美元仅用于冒烟测试；advisory_start_usd 不是执行最低额或市场排名，且不存在全局原生 USDC 起始金额。目录 https://assetfare.dev/route-economics.json。插件不会选择、准备、签名、提交，也不会接收钱包密钥。
icon: icon.svg
repo: https://github.com/assetfare/dify-plugin-assetfare
contact: support@assetfare.dev
privacy: PRIVACY.md
network:
  domains:
    - api.assetfare.dev
resource:
  memory: 268435456
  permission:
    tool:
      enabled: true
plugins:
  tools:
    - provider/assetfare.yaml
meta:
  version: 0.0.11
  minimum_dify_version: 1.4.0
  arch:
    - amd64
    - arm64
  runner:
    language: python
    version: "3.12"
    entrypoint: main
tags:
  - utilities
  - finance
