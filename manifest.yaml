version: 0.0.3
type: plugin
author: odaiin
name: assetfare
label:
  en_US: AssetFare
  zh_Hans: AssetFare
created_at: "2026-09-17T00:00:00Z"
description:
  en_US: Non-custodial cross-chain route quotes across six source chains (Polygon/Optimism are native-USDC source-only, not execution-ready this phase) plus caller-approved, unsigned /v2/prepare and /v2/session lifecycle tools. AssetFare never signs, submits, or takes a private key or credential; the caller verifies, signs, and submits with its own wallet.
  zh_Hans: 覆盖六个源链的非托管跨链路由报价（Polygon/Optimism 为原生 USDC 仅作源，本阶段不可执行），以及调用方批准的未签名 /v2/prepare 与 /v2/session 生命周期工具。AssetFare 绝不签名、提交或接收私钥或凭据；由调用方用自己的钱包验证、签名并提交。
icon: icon.svg
repo: https://github.com/odaiin/dify-plugin-assetfare
contact: support@assetfare.dev
privacy: PRIVACY.md
network:
  domains:
    - api.assetfare.dev
resource:
  memory: 268435456
  permission:
    tool:
      enabled: true
plugins:
  tools:
    - provider/assetfare.yaml
meta:
  version: 0.0.3
  minimum_dify_version: 1.4.0
  arch:
    - amd64
    - arm64
  runner:
    language: python
    version: "3.12"
    entrypoint: main
tags:
  - utilities
  - finance
