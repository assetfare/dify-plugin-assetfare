version: 0.0.4
type: plugin
author: odaiin
name: assetfare
label:
  en_US: AssetFare
  zh_Hans: AssetFare
created_at: "2026-09-17T00:00:00Z"
description:
  en_US: Non-custodial bridge and cross-chain swap quotes across 76 routes and six source chains; quotes show total token-path cost and live availability. AssetFare service fee 1bp; Circle/provider/network fees additional. Unsigned caller-approved actions only; never signs or submits.
  zh_Hans: 覆盖六个源链与 76 条路由的非托管报价及调用方批准的未签名执行；Polygon/Optimism 为原生 USDC 仅作源的方向性路由。AssetFare 绝不签名、提交或接收私钥或凭据；由调用方用自己的钱包验证、签名并提交。
icon: icon.svg
repo: https://github.com/odaiin/dify-plugin-assetfare
contact: support@assetfare.dev
privacy: PRIVACY.md
network:
  domains:
    - api.assetfare.dev
resource:
  memory: 268435456
  permission:
    tool:
      enabled: true
plugins:
  tools:
    - provider/assetfare.yaml
meta:
  version: 0.0.4
  minimum_dify_version: 1.4.0
  arch:
    - amd64
    - arm64
  runner:
    language: python
    version: "3.12"
    entrypoint: main
tags:
  - utilities
  - finance
