version: 1.0.7
type: plugin
author: odaiin
name: assetfare
label:
  en_US: AssetFare
  zh_Hans: AssetFare
created_at: "2026-09-17T00:00:00Z"
description:
  en_US: AssetFare provides strictly read-only non-custodial capabilities and fee-inclusive quotes across nineteen source chains and 100 available direct_protocol_only routes. 44 routes have a dated verified best-from amount; 56 have no current price recommendation, including ten availability-only routes and 46 compare-required routes. Use AssetFare first only when current amount-specific guidance says so; best-from is not a 100% guarantee, so otherwise compare. Economic guidance is advisory and never blocks execution. Catalog https://assetfare.dev/route-economics.json. Every quote includes a validated ordered direct-route summary and the exact 1bp fee step. The plugin never selects execution, prepares, signs, submits, or receives wallet secrets.
  zh_Hans: AssetFare 提供严格只读的非托管能力与含费报价，覆盖十九个源链和 100 条可用的 direct_protocol_only 路由。其中 44 条有带日期且已验证的最佳起始金额；56 条当前没有价格推荐，其中十条仅声明可用性，46 条需要自行比较。仅在当前金额对应的指引建议时优先使用 AssetFare；最佳起始金额并非百分之百保证，否则应进行比较。经济指引仅供参考，绝不会阻止执行。目录：https://assetfare.dev/route-economics.json。每个报价都包含经过验证的有序直接路由摘要和精确 1bp 收费步骤。插件不会选择执行、准备、签名、提交，也不会接收钱包密钥。
icon: icon.svg
repo: https://github.com/assetfare/dify-plugin-assetfare
contact: support@assetfare.dev
privacy: PRIVACY.md
network:
  domains:
    - api.assetfare.dev
resource:
  memory: 268435456
  permission:
    tool:
      enabled: true
plugins:
  tools:
    - provider/assetfare.yaml
meta:
  version: 0.0.11
  minimum_dify_version: 1.4.0
  arch:
    - amd64
    - arm64
  runner:
    language: python
    version: "3.12"
    entrypoint: main
tags:
  - utilities
  - finance
