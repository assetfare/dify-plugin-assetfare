version: 0.0.8
type: plugin
author: odaiin
name: assetfare
label:
  en_US: AssetFare
  zh_Hans: AssetFare
created_at: "2026-09-17T00:00:00Z"
description:
  en_US: Strictly read-only non-custodial capabilities and fee-inclusive bridge/cross-chain swap quotes across six source chains and 76 routes. USD 1 minimum, no business maximum, exact 1bp AssetFare fee with no service-fee maximum; Circle/provider/network fees additional. No wallet or execution tools.
  zh_Hans: 严格只读的非托管能力与含费跨链报价，覆盖六个源链和 76 条路由。最低 1 美元、无业务金额上限，AssetFare 精确 1bp 且无服务费上限；Circle/提供商/网络费另计。不提供钱包或执行工具。
icon: icon.svg
repo: https://github.com/odaiin/dify-plugin-assetfare
contact: support@assetfare.dev
privacy: PRIVACY.md
network:
  domains:
    - api.assetfare.dev
resource:
  memory: 268435456
  permission:
    tool:
      enabled: true
plugins:
  tools:
    - provider/assetfare.yaml
meta:
  version: 0.0.8
  minimum_dify_version: 1.4.0
  arch:
    - amd64
    - arm64
  runner:
    language: python
    version: "3.12"
    entrypoint: main
tags:
  - utilities
  - finance
