identity:
  author: odaiin
  name: assetfare_session_create
  label:
    en_US: Create an AssetFare session (full lifecycle)
    zh_Hans: 创建 AssetFare 会话（完整生命周期）
description:
  human:
    en_US: On explicit caller approval, open one receipt-driven session for a route whose fresh quote reports current availability. Returns an unsigned action; never signs or submits.
    zh_Hans: 在调用方明确批准后，调用 /v2/session 为执行就绪路由创建一个幂等、凭据驱动的会话并返回首步未签名操作。绝不签名或提交。
  llm: Explicit caller-approved full-lifecycle create. Only after the caller approves a route whose fresh quote reports current availability, POST /v2/session to open an idempotent receipt-driven session and return its first unsigned action. Requires literal caller_approved true, exact public wallet map, caller-generated session_token, and idempotency_key. Never auto-chain; never pass secrets; AssetFare never signs or submits.
parameters:
  - name: caller_approved
    type: boolean
    required: true
    form: llm
    label: {en_US: Caller approved, zh_Hans: 调用方已批准}
    human_description: {en_US: Must be true, set only after explicit caller approval of this exact route., zh_Hans: 必须为 true，仅在调用方明确批准该确切路由后设置。}
    llm_description: must be literally true; set only from an explicit caller approval of this exact route, never auto-filled from a quote
  - name: from_chain
    type: select
    required: true
    form: llm
    label: {en_US: Source chain, zh_Hans: 源链}
    human_description: {en_US: The source chain., zh_Hans: 源链。}
    llm_description: source chain, one of solana, base, arbitrum, robinhood, polygon, optimism
    options:
      - {value: solana, label: {en_US: solana, zh_Hans: solana}}
      - {value: base, label: {en_US: base, zh_Hans: base}}
      - {value: arbitrum, label: {en_US: arbitrum, zh_Hans: arbitrum}}
      - {value: robinhood, label: {en_US: robinhood, zh_Hans: robinhood}}
      - {value: polygon, label: {en_US: polygon, zh_Hans: polygon}}
      - {value: optimism, label: {en_US: optimism, zh_Hans: optimism}}
  - name: from_token
    type: select
    required: true
    form: llm
    label: {en_US: Source token, zh_Hans: 源资产}
    human_description: {en_US: The source asset symbol., zh_Hans: 源资产符号。}
    llm_description: source asset symbol, one of SOL, ETH, USDC, USDG
    options:
      - {value: SOL, label: {en_US: SOL, zh_Hans: SOL}}
      - {value: ETH, label: {en_US: ETH, zh_Hans: ETH}}
      - {value: USDC, label: {en_US: USDC, zh_Hans: USDC}}
      - {value: USDG, label: {en_US: USDG, zh_Hans: USDG}}
  - name: to_chain
    type: select
    required: true
    form: llm
    label: {en_US: Destination chain, zh_Hans: 目标链}
    human_description: {en_US: The destination chain., zh_Hans: 目标链。}
    llm_description: destination chain, one of solana, base, arbitrum, robinhood
    options:
      - {value: solana, label: {en_US: solana, zh_Hans: solana}}
      - {value: base, label: {en_US: base, zh_Hans: base}}
      - {value: arbitrum, label: {en_US: arbitrum, zh_Hans: arbitrum}}
      - {value: robinhood, label: {en_US: robinhood, zh_Hans: robinhood}}
  - name: to_token
    type: select
    required: true
    form: llm
    label: {en_US: Destination token, zh_Hans: 目标资产}
    human_description: {en_US: The destination asset symbol., zh_Hans: 目标资产符号。}
    llm_description: destination asset symbol, one of SOL, ETH, USDC, USDG
    options:
      - {value: SOL, label: {en_US: SOL, zh_Hans: SOL}}
      - {value: ETH, label: {en_US: ETH, zh_Hans: ETH}}
      - {value: USDC, label: {en_US: USDC, zh_Hans: USDC}}
      - {value: USDG, label: {en_US: USDG, zh_Hans: USDG}}
  - name: amount_usd
    type: number
    required: true
    form: llm
    label: {en_US: Amount (USD), zh_Hans: 金额（美元）}
    human_description: {en_US: Notional in USD, 1 to 1000 inclusive., zh_Hans: 名义金额（美元），1 到 1000（含）。}
    llm_description: notional in USD, between 1 and 1000 inclusive
    min: 1
    max: 1000
  - name: wallets
    type: string
    required: true
    form: llm
    label: {en_US: Public wallet map (JSON), zh_Hans: 公开钱包映射（JSON）}
    human_description:
      en_US: JSON object mapping each route chain to its PUBLIC wallet address. Public addresses only, never a private key or seed.
      zh_Hans: 将每个路由链映射到其公开钱包地址的 JSON 对象。仅限公开地址，绝不填写私钥或助记词。
    llm_description: 'a JSON object mapping each route chain (at least source and destination) to its PUBLIC wallet address; public addresses only, never a private key, seed, or signed transaction'
  - name: session_token
    type: secret-input
    required: true
    form: llm
    label: {en_US: Session capability token, zh_Hans: 会话能力令牌}
    human_description:
      en_US: The caller-generated token from assetfare_new_session_capability. Sensitive; not a private key.
      zh_Hans: 由 assetfare_new_session_capability 生成的调用方令牌。敏感凭据；非私钥。
    llm_description: the caller-generated session capability token from assetfare_new_session_capability (43-128 url-safe chars); sensitive bearer value, never a private key; reuse the same token to recover the same session
  - name: idempotency_key
    type: string
    required: true
    form: llm
    label: {en_US: Idempotency key, zh_Hans: 幂等键}
    human_description: {en_US: A stable key (8-128 chars) so a retry recovers the same session., zh_Hans: 稳定的键（8-128 字符），使重试恢复同一会话。}
    llm_description: a stable idempotency key (8-128 chars); reuse the same token + key to safely retry a lost create response and recover the same session
  - name: event_signer_public
    type: string
    required: false
    form: llm
    label: {en_US: Event signer public key (Solana CCTP only), zh_Hans: 事件签名者公钥（仅 Solana CCTP）}
    human_description: {en_US: Solana CCTP only. Generate a fresh ephemeral keypair locally, send only its public key, and retain its private key client-side for co-signing., zh_Hans: 仅用于 Solana CCTP。在本地生成新的临时密钥对，仅发送公钥，并将私钥保留在客户端用于共同签署。}
    llm_description: Solana CCTP only; public key of a fresh locally generated ephemeral keypair; keep the private key client-side to co-sign the returned unsigned event-account transaction
extra:
  python:
    source: tools/assetfare_session_create.py
