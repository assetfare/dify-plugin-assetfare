identity:
  author: odaiin
  name: assetfare_observe_output
  label:
    en_US: Observe AssetFare output
    zh_Hans: 观察 AssetFare 输出
description:
  human:
    en_US: Observe the caller's already-produced destination/bridge output for a session and advance the workflow. Never submits a transaction.
    zh_Hans: 观察会话中调用方已产生的目标/桥接输出并推进工作流。绝不提交交易。
  llm: Observe the caller's ALREADY-produced destination/bridge output for a v2 session and advance the receipt-driven workflow. Requires the caller's session token, the session_id, and an idempotency_key; an optional destination transaction_hash may be provided. Never submits a transaction.
parameters:
  - name: session_token
    type: secret-input
    required: true
    form: llm
    label: {en_US: Session capability token, zh_Hans: 会话能力令牌}
    human_description: {en_US: The caller-generated session token. Sensitive; not a private key., zh_Hans: 调用方生成的会话令牌。敏感；非私钥。}
    llm_description: the caller's session capability token; sensitive bearer value, never a private key
  - name: session_id
    type: string
    required: true
    form: llm
    label: {en_US: Session ID, zh_Hans: 会话 ID}
    human_description: {en_US: The session_id returned by session_create., zh_Hans: session_create 返回的 session_id。}
    llm_description: the session_id returned by assetfare_session_create
  - name: idempotency_key
    type: string
    required: true
    form: llm
    label: {en_US: Idempotency key, zh_Hans: 幂等键}
    human_description: {en_US: A stable key (8-128 chars) so a retry is idempotent., zh_Hans: 稳定的键（8-128 字符），使重试幂等。}
    llm_description: a stable idempotency key (8-128 chars) for this observation
  - name: transaction_hash
    type: string
    required: false
    form: llm
    label: {en_US: Output tx hash (optional), zh_Hans: 输出交易哈希（可选）}
    human_description: {en_US: Optional destination/output transaction hash the caller already produced., zh_Hans: 可选，调用方已产生的目标/输出交易哈希。}
    llm_description: optional destination/output transaction hash the caller already produced on chain; only observed, never submitted
extra:
  python:
    source: tools/assetfare_observe_output.py
