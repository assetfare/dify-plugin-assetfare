identity:
  author: odaiin
  name: assetfare_prepare
  label:
    en_US: Prepare an AssetFare unsigned action (one-shot)
    zh_Hans: 生成 AssetFare 未签名操作（一次性）
description:
  human:
    en_US: On explicit caller approval, POST /v2/prepare for one fresh, re-quoted, bounded UNSIGNED first action for any supported route. Never signs or submits; no private key.
    zh_Hans: 在调用方明确批准后，调用 /v2/prepare 获取任一支持路由的全新、重新报价、有界的未签名首步操作。绝不签名或提交；无私钥。
  llm: Explicit caller-approved one-shot. Only after the caller EXPLICITLY approves a route whose fresh quote reports current prepare availability, POST the fixed-origin /v2/prepare to obtain the re-quoted bounded FIRST unsigned action bundle. Requires caller_approved literally true and the route's exact PUBLIC wallet map. Never auto-call from a quote; never pass a private key, seed, or signed transaction. AssetFare never signs or submits.
parameters:
  - name: caller_approved
    type: boolean
    required: true
    form: llm
    label:
      en_US: Caller approved
      zh_Hans: 调用方已批准
    human_description:
      en_US: Must be true, set only after the caller explicitly approved this exact route.
      zh_Hans: 必须为 true，仅在调用方明确批准该确切路由后设置。
    llm_description: must be literally true; set only from an explicit caller approval of this exact route, never auto-filled from a quote
  - name: from_chain
    type: select
    required: true
    form: llm
    label: {en_US: Source chain, zh_Hans: 源链}
    human_description: {en_US: The source chain., zh_Hans: 源链。}
    llm_description: source chain, one of solana, base, arbitrum, robinhood, polygon, optimism
    options:
      - {value: solana, label: {en_US: solana, zh_Hans: solana}}
      - {value: base, label: {en_US: base, zh_Hans: base}}
      - {value: arbitrum, label: {en_US: arbitrum, zh_Hans: arbitrum}}
      - {value: robinhood, label: {en_US: robinhood, zh_Hans: robinhood}}
      - {value: polygon, label: {en_US: polygon, zh_Hans: polygon}}
      - {value: optimism, label: {en_US: optimism, zh_Hans: optimism}}
  - name: from_token
    type: select
    required: true
    form: llm
    label: {en_US: Source token, zh_Hans: 源资产}
    human_description: {en_US: The source asset symbol., zh_Hans: 源资产符号。}
    llm_description: source asset symbol, one of SOL, ETH, USDC, USDG
    options:
      - {value: SOL, label: {en_US: SOL, zh_Hans: SOL}}
      - {value: ETH, label: {en_US: ETH, zh_Hans: ETH}}
      - {value: USDC, label: {en_US: USDC, zh_Hans: USDC}}
      - {value: USDG, label: {en_US: USDG, zh_Hans: USDG}}
  - name: to_chain
    type: select
    required: true
    form: llm
    label: {en_US: Destination chain, zh_Hans: 目标链}
    human_description: {en_US: The destination chain., zh_Hans: 目标链。}
    llm_description: destination chain, one of solana, base, arbitrum, robinhood
    options:
      - {value: solana, label: {en_US: solana, zh_Hans: solana}}
      - {value: base, label: {en_US: base, zh_Hans: base}}
      - {value: arbitrum, label: {en_US: arbitrum, zh_Hans: arbitrum}}
      - {value: robinhood, label: {en_US: robinhood, zh_Hans: robinhood}}
  - name: to_token
    type: select
    required: true
    form: llm
    label: {en_US: Destination token, zh_Hans: 目标资产}
    human_description: {en_US: The destination asset symbol., zh_Hans: 目标资产符号。}
    llm_description: destination asset symbol, one of SOL, ETH, USDC, USDG
    options:
      - {value: SOL, label: {en_US: SOL, zh_Hans: SOL}}
      - {value: ETH, label: {en_US: ETH, zh_Hans: ETH}}
      - {value: USDC, label: {en_US: USDC, zh_Hans: USDC}}
      - {value: USDG, label: {en_US: USDG, zh_Hans: USDG}}
  - name: amount_usd
    type: number
    required: true
    form: llm
    label: {en_US: Amount (USD), zh_Hans: 金额（美元）}
    human_description: {en_US: Finite numeric notional in USD, minimum 1; no business maximum., zh_Hans: 美元名义金额，须为有限数值且最低为 1；无业务上限。}
    llm_description: finite numeric notional in USD, minimum 1; no business maximum
    min: 1
  - name: wallets
    type: string
    required: true
    form: llm
    label: {en_US: Public wallet map (JSON), zh_Hans: 公开钱包映射（JSON）}
    human_description:
      en_US: JSON object mapping each route chain to its PUBLIC wallet address, e.g. {"solana":"...","base":"0x..."}. Public addresses only, never a private key or seed.
      zh_Hans: 将每个路由链映射到其公开钱包地址的 JSON 对象，例如 {"solana":"...","base":"0x..."}。仅限公开地址，绝不填写私钥或助记词。
    llm_description: 'a JSON object mapping each of the route chains (at least the source and destination chain) to its PUBLIC wallet address, e.g. {"solana":"<base58>","base":"0x..."}; public addresses only, never a private key, seed, or signed transaction'
  - name: event_signer_public
    type: string
    required: false
    form: llm
    label: {en_US: Event signer public key (Solana CCTP only), zh_Hans: 事件签名者公钥（仅 Solana CCTP）}
    human_description:
      en_US: Solana CCTP only. Generate a fresh ephemeral Solana keypair locally, send only its PUBLIC key, keep the private key client-side, and co-sign the returned unsigned event-account transaction.
      zh_Hans: 仅用于 Solana CCTP。在本地生成新的临时 Solana 密钥对，仅发送公钥，私钥保留在客户端并用于共同签署返回的未签名事件账户交易。
    llm_description: Solana CCTP only; generate a fresh ephemeral keypair locally, provide only its public key, keep the private key client-side, and use it to co-sign the returned unsigned event-account transaction
extra:
  python:
    source: tools/assetfare_prepare.py
