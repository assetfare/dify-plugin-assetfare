identity:
  author: odaiin
  name: assetfare_session_get
  label:
    en_US: Read an AssetFare session
    zh_Hans: 读取 AssetFare 会话
description:
  human:
    en_US: Read a v2 session's current workflow state and current unsigned action. Requires the caller's session token. Read-only.
    zh_Hans: 读取 v2 会话的当前工作流状态与当前未签名操作。需要调用方会话令牌。只读。
  llm: Read a v2 session's current workflow state and current unsigned action. Requires the caller's session capability token and the session_id returned by assetfare_session_create. Read-only; never signs or submits.
parameters:
  - name: session_token
    type: secret-input
    required: true
    form: llm
    label: {en_US: Session capability token, zh_Hans: 会话能力令牌}
    human_description: {en_US: The caller-generated session token. Sensitive; not a private key., zh_Hans: 调用方生成的会话令牌。敏感；非私钥。}
    llm_description: the caller's session capability token (same one used to create the session); sensitive bearer value, never a private key
  - name: session_id
    type: string
    required: true
    form: llm
    label: {en_US: Session ID, zh_Hans: 会话 ID}
    human_description: {en_US: The session_id returned by session_create., zh_Hans: session_create 返回的 session_id。}
    llm_description: the session_id returned by assetfare_session_create
extra:
  python:
    source: tools/assetfare_session_get.py
