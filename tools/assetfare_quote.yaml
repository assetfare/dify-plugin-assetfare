identity:
  author: odaiin
  name: assetfare_quote
  label:
    en_US: Quote an AssetFare route
    zh_Hans: 查询 AssetFare 路由报价
description:
  human:
    en_US: Get one fresh fee-inclusive direct_protocol_only quote with route-specific guidance, an ordered direct-route summary, and the exact 1bp fee step. Use a best-from amount only when verified; availability-only routes make no cheapest-price claim. Read-only.
    zh_Hans: 获取一次包含费用的 direct_protocol_only 最新报价，并附带按路由划分的指引、有序直接路由摘要和精确 1bp 收费步骤。仅在最佳起始金额已验证时使用；仅可用性路由不声称价格最低。只读。
  llm: >-
    Request one fresh AssetFare quote with expected/minimum receive, total token-path cost, provider fee
    components, ETA, live availability, direct_route_summary, and a sanitized continuation_descriptor. Treat direct_route_summary as the validated
    ordered path: every step names the protocol, normalized endpoints, expected/minimum base-unit inputs and
    outputs, direct-versus-external classification, and the one exact 1bp fee index.
    route_aggregator_used=false means AssetFare did not call a market-wide aggregator API. All 100 available
    routes are direct_protocol_only; external_intent remains only a compatibility enum with zero current routes.
    The USD 1 technical minimum is only for reachability/response-shape smoke tests.
    Use economic_guidance.best_from_usd only when best_from_verified=true. Availability-only routes have a null
    threshold and make no cheapest-price claim. Use https://assetfare.dev/route-economics.json and always confirm the fresh quote. The descriptor exposes
    an unranked expiring quote binding, wallet-chain/event-signer requirements, permitted mode, and the full
    OpenAPI URL. This tool never generates approval_v3, selects a mode, collects wallets, or calls prepare/session;
    caller_approved alone is not proof of human approval and legacy handoff is advisory. Evaluation only; no
    wallet, action, session, signing, or submission tool.
parameters:
  - name: from_chain
    type: select
    required: true
    form: llm
    label:
      en_US: Source chain
      zh_Hans: 源链
    human_description:
      en_US: The source chain to move value from.
      zh_Hans: 转出价值的源链。
    llm_description: source chain, one of solana, base, arbitrum, robinhood, polygon, optimism, ethereum, hyperevm, xlayer, sei, sonic, monad, avalanche, cronos, injective, linea, aptos, unichain, ink; source-only routes include Polygon/Optimism to Base or Arbitrum, Ethereum/HyperEVM to Base or Solana, X Layer/Sei/Sonic/Monad/Avalanche/Cronos/Injective/Linea/Aptos to Base or Solana, and Unichain/Ink to Solana; check live availability
    options:
      - value: solana
        label: {en_US: solana, zh_Hans: solana}
