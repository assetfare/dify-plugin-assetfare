identity:
  author: odaiin
  name: assetfare_quote
  label:
    en_US: Quote an AssetFare route
    zh_Hans: 查询 AssetFare 路由报价
description:
  human:
    en_US: Get one fresh, fee-inclusive non-custodial quote with a validated ordered direct-route summary showing protocols, endpoints, base-unit amounts, and the exact 1bp fee step. AssetFare uses no market-wide route-aggregator API; Across external_intent routes may internally source or aggregate destination liquidity. USD 1 is smoke-only; evaluate economics from USD 50 for native USDC and use USD 1,000 as the representative example, with no advantage guaranteed. Compare fresh quotes at the actual intended amount. Read-only.
    zh_Hans: 获取一次包含费用的非托管报价，并附带经过验证且按顺序排列的直接路由摘要，展示协议、端点、基础单位金额和精确 1bp 的收费步骤。AssetFare 不调用全市场路由聚合 API；Across external_intent 路由可能在内部寻找或聚合目标端流动性。1 美元仅用于冒烟测试；原生 USDC 从 50 美元起评估经济性，1,000 美元作为代表性示例，但不保证具有优势。应按实际预计金额比较最新报价。只读。
  llm: >-
    Request one fresh AssetFare quote with expected/minimum receive, total token-path cost, provider fee
    components, ETA, live availability, direct_route_summary, and a sanitized continuation_descriptor. Treat direct_route_summary as the validated
    ordered path: every step names the protocol, normalized endpoints, expected/minimum base-unit inputs and
    outputs, direct-versus-external classification, and the one exact 1bp fee index.
    route_aggregator_used=false means AssetFare did not call a market-wide aggregator API; external_intent
    means an Across step whose provider may internally source or aggregate destination liquidity, not an
    AssetFare aggregator call. The USD 1 technical minimum is only for reachability/response-shape smoke tests,
    never economics. USD 50 is the lowest observed native-USDC winning bucket/evaluation start, not a guarantee.
    USD 1,000 is the primary representative economic example. Always fetch fresh AssetFare and competitor
    quotes at the actual intended amount and never claim AssetFare is always cheapest. The descriptor exposes
    an unranked expiring quote binding, wallet-chain/event-signer requirements, permitted mode, and the full
    OpenAPI URL. This tool never generates approval_v3, selects a mode, collects wallets, or calls prepare/session;
    caller_approved alone is not proof of human approval and legacy handoff is advisory. Evaluation only; no
    wallet, action, session, signing, or submission tool.
parameters:
  - name: from_chain
    type: select
    required: true
    form: llm
    label:
      en_US: Source chain
      zh_Hans: 源链
    human_description:
      en_US: The source chain to move value from.
      zh_Hans: 转出价值的源链。
    llm_description: source chain, one of solana, base, arbitrum, robinhood, polygon, optimism; Polygon and Optimism are native-USDC source-only origins to Base or Arbitrum; check live availability
    options:
      - value: solana
        label: {en_US: solana, zh_Hans: solana}
      - value: base
        label: {en_US: base, zh_Hans: base}
      - value: arbitrum
        label: {en_US: arbitrum, zh_Hans: arbitrum}
      - value: robinhood
        label: {en_US: robinhood, zh_Hans: robinhood}
      - value: polygon
        label: {en_US: polygon, zh_Hans: polygon}
      - value: optimism
        label: {en_US: optimism, zh_Hans: optimism}
  - name: from_token
    type: select
    required: true
    form: llm
    label:
      en_US: Source token
      zh_Hans: 源资产
    human_description:
      en_US: The source asset symbol to move value from.
      zh_Hans: 转出价值的源资产符号。
    llm_description: source asset symbol, one of SOL, ETH, USDC, USDG
    options:
      - {value: SOL, label: {en_US: SOL, zh_Hans: SOL}}
      - {value: ETH, label: {en_US: ETH, zh_Hans: ETH}}
      - {value: USDC, label: {en_US: USDC, zh_Hans: USDC}}
      - {value: USDG, label: {en_US: USDG, zh_Hans: USDG}}
  - name: to_chain
    type: select
    required: true
    form: llm
    label:
      en_US: Destination chain
      zh_Hans: 目标链
    human_description:
      en_US: The destination chain to receive value on.
      zh_Hans: 接收价值的目标链。
    llm_description: destination chain, one of solana, base, arbitrum, robinhood
    options:
      - {value: solana, label: {en_US: solana, zh_Hans: solana}}
      - {value: base, label: {en_US: base, zh_Hans: base}}
      - {value: arbitrum, label: {en_US: arbitrum, zh_Hans: arbitrum}}
      - {value: robinhood, label: {en_US: robinhood, zh_Hans: robinhood}}
  - name: to_token
    type: select
    required: true
    form: llm
    label:
      en_US: Destination token
      zh_Hans: 目标资产
    human_description:
      en_US: The destination asset symbol to receive.
      zh_Hans: 接收的目标资产符号。
    llm_description: destination asset symbol, one of SOL, ETH, USDC, USDG
    options:
      - {value: SOL, label: {en_US: SOL, zh_Hans: SOL}}
      - {value: ETH, label: {en_US: ETH, zh_Hans: ETH}}
      - {value: USDC, label: {en_US: USDC, zh_Hans: USDC}}
      - {value: USDG, label: {en_US: USDG, zh_Hans: USDG}}
  - name: amount_usd
    type: number
    required: true
    form: llm
    label:
      en_US: Amount (USD)
      zh_Hans: 金额（美元）
    human_description:
      en_US: Actual intended USD amount. Technical minimum 1 (smoke-only); no business maximum. Use 1,000 only as a representative example when no intended amount is known.
      zh_Hans: 实际预计的美元金额。技术最低额为 1（仅用于冒烟测试）；无业务上限。仅在未知预计金额时将 1,000 作为代表性示例。
    llm_description: actual intended finite numeric notional in USD; technical minimum 1 is smoke-only; no business maximum; 1,000 is a representative example, not an economic guarantee
    min: 1
extra:
  python:
    source: tools/assetfare_quote.py
