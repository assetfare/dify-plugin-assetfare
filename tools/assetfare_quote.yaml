      zh_Hans: 实际预计的美元金额。技术最低额为 1（仅用于冒烟测试）；无业务上限。价格已验证的报价会返回最佳起始金额；仅可用性报价返回空值。
    llm_description: actual intended finite numeric notional in USD; technical minimum 1 is smoke-only; no business maximum; use returned best_from_usd only when best_from_verified=true
    min: 1
