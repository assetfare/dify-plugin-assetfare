identity:
  author: odaiin
  name: assetfare_observe_source
  label:
    en_US: Observe AssetFare source transactions
    zh_Hans: 观察 AssetFare 源交易
description:
  human:
    en_US: Observe the caller's already-submitted source transaction hashes for a session and advance the workflow. Never submits a transaction.
    zh_Hans: 观察会话中调用方已提交的源交易哈希并推进工作流。绝不提交交易。
  llm: Observe the caller's ALREADY-submitted source transaction hashes for a v2 session and advance the receipt-driven workflow. Requires the caller's session token, the session_id, an idempotency_key, and the transaction hashes the caller already submitted. Only caller-submitted hashes are observed; this never submits a transaction and never auto-chains.
parameters:
  - name: session_token
    type: secret-input
    required: true
    form: llm
    label: {en_US: Session capability token, zh_Hans: 会话能力令牌}
    human_description: {en_US: The caller-generated session token. Sensitive; not a private key., zh_Hans: 调用方生成的会话令牌。敏感；非私钥。}
    llm_description: the caller's session capability token; sensitive bearer value, never a private key
  - name: session_id
    type: string
    required: true
    form: llm
    label: {en_US: Session ID, zh_Hans: 会话 ID}
    human_description: {en_US: The session_id returned by session_create., zh_Hans: session_create 返回的 session_id。}
    llm_description: the session_id returned by assetfare_session_create
  - name: idempotency_key
    type: string
    required: true
    form: llm
    label: {en_US: Idempotency key, zh_Hans: 幂等键}
    human_description: {en_US: A stable key (8-128 chars) so a retry is idempotent., zh_Hans: 稳定的键（8-128 字符），使重试幂等。}
    llm_description: a stable idempotency key (8-128 chars) for this observation
  - name: transaction_hashes
    type: string
    required: true
    form: llm
    label: {en_US: Submitted source tx hashes (JSON array), zh_Hans: 已提交的源交易哈希（JSON 数组）}
    human_description:
      en_US: The source transaction hashes the caller already submitted, as a JSON array, e.g. ["0x..."].
      zh_Hans: 调用方已提交的源交易哈希，JSON 数组，例如 ["0x..."]。
    llm_description: 'the source transaction hashes the caller has ALREADY submitted on chain, as a JSON array of 1-8 strings, e.g. ["0x...", "..."]; these are only observed, never submitted'
extra:
  python:
    source: tools/assetfare_observe_source.py
